# pacman.conf for the devkitPro prefix that `pz-build devkitpro` manages. Package signatures are required, checked
# against devkitPro's keyring (bootstrapped from WinterMute's key); don't relax SigLevel.
# DisableSandbox: pacman's download sandbox can't drop to a download user inside `unshare -r`.
[options]
Architecture = x86_64
SigLevel = Required DatabaseOptional
DisableSandbox

[dkp-libs]
Server = https://pkg.devkitpro.org/packages

[dkp-linux]
Server = https://pkg.devkitpro.org/packages/linux/$arch/
